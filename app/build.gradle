plugins {
    id 'com.android.application'
}

dependencies {
    implementation 'com.github.omicronapps:7-Zip-JBinding-4Android:Release-16.02-2.03'
    implementation('com.tom-roush:pdfbox-android:2.0.27.0') { exclude group: 'org.bouncycastle' }
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.75'
    implementation "org.opencv:opencv:4.12.0"
    implementation "androidx.drawerlayout:drawerlayout:1.2.0"
    implementation 'org.apache.commons:commons-compress:1.28.0'
    implementation 'org.tukaani:xz:1.10'
    implementation 'com.hierynomus:smbj:0.13.0'
    implementation 'commons-net:commons-net:3.13.0'
    implementation 'com.google.android.gms:play-services-auth:22.0.0'
}

def releaseSigning = [
        keystorePath: System.getenv('ANDROID_KEYSTORE_PATH'),
        storePassword: System.getenv('ANDROID_KEYSTORE_PASSWORD'),
        keyAlias: System.getenv('ANDROID_KEY_ALIAS'),
        keyPassword: System.getenv('ANDROID_KEY_PASSWORD')
]
def missingReleaseSigning = releaseSigning.findAll { entry ->
    entry.value == null || entry.value.trim().isEmpty()
}.keySet()
def validationApplicationIdSuffix = providers.gradleProperty('comicExplorerValidationSuffix').orElse('.validation')

android {
    namespace 'jp.yaman.comicexplorer'
    compileSdk 35
    buildToolsVersion '36.0.0'
    if (providers.gradleProperty('comicExplorerReleaseInstrumentation').orNull == 'true') testBuildType 'release'

    defaultConfig {
        applicationId 'jp.yaman.comicexplorer'
        minSdk 29
        targetSdk 35
        testInstrumentationRunner 'jp.yaman.comicexplorer.ParityInstrumentation'
        versionCode providers.gradleProperty('comicExplorerVersionCode').get().toInteger()
        versionName providers.gradleProperty('comicExplorerVersionName').get()
    }

    signingConfigs {
        release {
            if (missingReleaseSigning.isEmpty()) {
                storeFile file(releaseSigning.keystorePath)
                storePassword releaseSigning.storePassword
                keyAlias releaseSigning.keyAlias
                keyPassword releaseSigning.keyPassword
            }
        }
    }

    buildTypes {
        debug {
            if (providers.gradleProperty('comicExplorerValidation').orNull == 'true') applicationIdSuffix validationApplicationIdSuffix.get()
        }
        release {
            signingConfig signingConfigs.release
            if (providers.gradleProperty('comicExplorerValidation').orNull == 'true') applicationIdSuffix validationApplicationIdSuffix.get()
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
            universalApk true // Keeps the existing single-APK Debug workflow; Release publishing omits it.
        }
    }
    bundle { language { enableSplit = false } }
    packagingOptions { resources {
        excludes += ['META-INF/INDEX.LIST', 'META-INF/DEPENDENCIES']
        merges += ['META-INF/LICENSE*', 'META-INF/NOTICE*']
    } }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

gradle.taskGraph.whenReady { graph ->
    boolean releasePackagingRequested = graph.allTasks.any { task ->
        task.path ==~ /.*:(assemble|bundle|package).*Release.*/
    }
    if (releasePackagingRequested && !missingReleaseSigning.isEmpty()) {
        throw new GradleException('Release signing is incomplete. Set ANDROID_KEYSTORE_PATH, '
                + 'ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD.')
    }
}
